<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metric/Imperial Unit Conversion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <main class="app">

    <header class="top">
      <h1>Metric/Imperial Unit Conversion</h1>
      <p class="hint">Type a number and press Convert</p>
      <input type="number" id="num-input" placeholder="0" aria-label="Number to convert">
      <button id="convert-btn">Convert</button>
    </header>

    <section class="results">

      <div class="card length">
        <h2>📏 Length (Meter/Feet)</h2>
        <p id="length-el">0 meters = 0 feet | 0 feet = 0 meters</p>
      </div>

      <div class="card volume">
        <h2>🧪 Volume (Liters/Gallons)</h2>
        <p id="volume-el">0 liters = 0 gallons | 0 gallons = 0 liters</p>
      </div>

      <div class="card mass">
        <h2>⚖️ Mass (Kilograms/Pounds)</h2>
        <p id="mass-el">0 kilos = 0 pounds | 0 pounds = 0 kilos</p>
      </div>

    </section>
  </main>

  <script src="index.js"></script>
</body>
</html>
