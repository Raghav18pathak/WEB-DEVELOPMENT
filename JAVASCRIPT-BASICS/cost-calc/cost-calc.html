<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="cost-calc.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cost Calculator</title>
</head>
<body>
    <div class="all">
    <div class="title">
    <h1> Fuel Cost calculator </h1>
    <img src="Mat_Marshal_Green_Metallic_newcb350.png">
    </div>
    <p>Distance Travelled(KM):</p>
    <input type="number" id="distance">
    <p>Mileage your bike is showing(KM/L):</p>
    <input type="number" id="mileage" >
    <p>Fuel Price in your Area(Rs/L):</p>
    <input type="number" id="price" >
    <button id="onclick">Calculate Cost</button>
    <p id="result"> The total Cost of your trip is: </p>
    <input type="text" id="total-cost-display" readonly placeholder="₹ 0.00">
    </div>
<script src="cost-calc.js"></script> 
</body>

</html>
