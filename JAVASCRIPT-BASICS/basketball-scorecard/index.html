<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="card">
    <p class="card-title">BASKETBALL SCORECARD</p>
 
    <div class="teams">
      <div class="team">
        <div class="team-name">HOME</div>
        <div class="score-box">
          <div class="score" id="home-score">0</div>
        </div>
        <div class="btn-group">
          <button class="btn" onclick="homeplusone()">+1</button>
          <button class="btn" onclick="homeplustwo()">+2</button>
          <button class="btn" onclick="homeplusthree()">+3</button>
        </div>
      </div>
 
      <div class="vs">VS</div>
 
      <div class="team">
        <div class="team-name">GUEST</div>
        <div class="score-box">
          <div class="score" id="guest-score">0</div>
        </div>
        <div class="btn-group">
          <button class="btn" onclick="guestplusone()">+1</button>
          <button class="btn" onclick="guestplustwo()">+2</button>
          <button class="btn" onclick="guestplusthree()">+3</button>
        </div>
      </div>
    </div>
 
    <div class="divider"></div>
 
    <div class="reset-row">
      <button class="reset-btn" onclick="reset()">RESET GAME</button>
    </div>
  </div>
        <script src="index.js"></script>
    </body>
</html>
